name: Package

# 触发：
#   - 推 `v*` tag：构建两个平台并把产物挂到对应的 GitHub Release。
#   - 手动（Actions → Package → Run workflow）：只构建并上传 Artifacts，不发 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 顶层只给只读；只有 release job 需要写权限（创建 Release 与上传资产）。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 与本地开发用的 tauri-cli 同一条线（本地 2.11.5）。这里必须是 `~` 而不是 `^`：
  # `^2.11` 实际会装到 2.12.x，装出来的 CLI 就不在 tauri crate（`~2.11`）的线上了。
  TAURI_CLI_VERSION: '~2.11'

jobs:
  macos:
    name: macOS（${{ matrix.arch }} DMG）
    runs-on: macos-latest
    strategy:
      # 两个架构是可独立交付的产物，一个挂了不该拖住另一个。
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust-target: aarch64-apple-darwin
          - arch: x64
            rust-target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # runner 上预装了 rustup/rustc，但仍然显式安装一次：CI 的可复现性不该依赖
      # runner 镜像的默认值。clippy/rustfmt 由 profile minimal 之外单独指定。
      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # arm64 runner 上编 x86_64 是交叉编译，但 Apple SDK 自带两份 slice、链接器也认
      # 两个架构，不需要额外垫片，只要求 rustup 里装了对应 target。
      - name: 安装 ${{ matrix.rust-target }} 目标
        run: rustup target add ${{ matrix.rust-target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      # 直接复用仓库里的打包脚本，而不是把步骤摊在 workflow 里：本地怎么打，CI 就怎么打，
      # 差别只有传进去的架构参数。
      - name: 打包（前端 → tauri build → ad-hoc 签名 → DMG）
        run: packaging/build.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ClipVault-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/${{ matrix.rust-target }}/release/bundle/dmg/ClipVault_*.dmg
            target/${{ matrix.rust-target }}/release/bundle/macos/ClipVault.app

  windows:
    name: Windows（NSIS 安装包）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # cargo 的 build.rs（tauri-build）要求 tauri.conf.json 的 frontendDist 目录存在，
      # 所以下面的 clippy / test 之前必须先有 frontend/dist。
      - name: 构建前端（cargo 的 build.rs 需要 frontendDist 存在）
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      # 下面两步是这个 workflow 存在的主要理由：本地开发机是 macOS，
      # cfg(target_os = "windows") 的分支在那里**根本不会被编译**，所以 Windows 目标的
      # 整树编译与 lint 只能在 CI 上验证。
      - name: clippy（Windows 目标）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试（Windows 目标）
        run: cargo test --workspace

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "$env:TAURI_CLI_VERSION" --locked

      - name: 打包（前端 → tauri build --bundles nsis）
        run: packaging/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ClipVault-windows-nsis
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe

  release:
    name: 发布到 GitHub Release
    needs: [macos, windows]
    # 只有 tag 推送才发版；手动触发时到此为止，产物留在 Artifacts 里。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 独立成一个 job（而不是让各平台/各架构自己往 Release 里塞）：它们并发跑时
      # 各自"没有就创建"会撞车。
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 挂载产物到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # .app 是目录，不能作为 release asset —— Release 只放 DMG 与 NSIS 安装包
          # （这两个 Artifacts 里都还有，供 CI 排障用）。两个架构的 DMG 都在这儿上去。
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "ClipVault $tag" --generate-notes
          gh release upload "$tag" dist/*.dmg dist/*.exe --clobber
          gh release view "$tag" --json assets --jq 'assets[].name'
