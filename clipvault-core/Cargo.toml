[package]
name = "clipvault-core"
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
regex = "1"
# U9：AES-256-GCM 纯算法（无 Keychain，跨平台可测）。
aes-gcm = "0.10"
# U9：每次写入的 12 字节随机 nonce。与 aes-gcm 0.10 共用 rand_core 0.6 生态。
rand = "0.8"
