<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipVault</title>
  </head>
  <body>
    <div id="app">
      <div class="panel">
        <div id="progress" class="progress"></div>
        <div id="banner" class="banner hidden"></div>
        <div id="vault-banner" class="banner banner-vault hidden"></div>
        <div id="guest-notice" class="banner banner-guest hidden"></div>
        <!-- 拖拽区：面板无标题栏（decorations: false），顶部搜索条整条充当可拖拽的
             「标题栏」。`deep` 让空白处与放大镜图标都能拖；`<input>` 属可点击元素、
             Tauri 的 drag.js 会主动放行，故输入框的选词 / 光标不受影响。 -->
        <div class="search-row" data-tauri-drag-region="deep">
          <!-- 放大镜：原来是 SF Symbols 私有区码点（U+1002AB），在 WebView2 / Windows
               默认字体下必然是豆腐块。改内联 SVG（U7）。`pointer-events: none`（见
               styles.css）保证从图标上按下也能拖动面板，与原来的纯文本字形行为一致。 -->
          <span class="search-icon"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.4"/><path d="M10.4 10.4 14.2 14.2"/></svg></span>
          <input
            id="search"
            type="text"
            placeholder="搜索剪贴板内容、备注、标签…"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </div>
        <div id="tabs" class="tabs"></div>
        <div id="list" class="list"></div>
        <!-- 底部提示：快捷键用 <kbd> 包成键帽（强调色 + 淡底 + 描边），说明文字保持弱化色，
             长条提示里靠颜色把「按什么」和「做什么」分开，扫读时先看到按键。
             `双击` 是鼠标手势，用同款样式的 <span class="keycap">：<kbd> 语义上只表示键盘输入，
             但视觉上要和键帽一致。括号里的补充说明用 .hint-note 再弱一层。 -->
        <div class="hint"><kbd>↩</kbd> 粘贴 · <kbd>⌘1–9</kbd> 直选 · <span class="keycap">双击</span> 回贴 · <kbd>⌘E</kbd> 备注 · <kbd>⌘P</kbd> 置顶 · <kbd>⌘L</kbd> 移入加密区 · <kbd>⌘O</kbd> 在浏览器打开 URL · <kbd>⌘⇧V</kbd> 加密区<span class="hint-note">（内可选 <kbd>↩</kbd> 回贴 / <kbd>⌘E</kbd> 备注）</span> · <kbd>⌘⇧G</kbd> 访客 · <kbd>⌘⇧N</kbd> 本次不记录 · <kbd>esc</kbd> 关闭</div>
        <div id="toast" class="toast hidden"></div>

        <!-- 备注 / 标签编辑器（U6）。默认隐藏，⌘E 唤出。 -->
        <div id="editor" class="editor hidden">
          <div class="editor-card">
            <div class="editor-head">
              <span class="editor-title">备注 &amp; 标签</span>
              <span id="editor-state" class="editor-state"></span>
            </div>
            <div class="editor-preview" id="editor-preview"></div>
            <div class="editor-field">
              <label class="editor-label" for="editor-note">备注</label>
              <textarea
                id="editor-note"
                class="editor-note"
                maxlength="2000"
                rows="4"
                placeholder="添加备注…（进入搜索索引）"
                spellcheck="false"
              ></textarea>
              <div class="editor-counter" id="editor-counter">0 / 2000</div>
            </div>
            <div class="editor-field">
              <label class="editor-label" for="editor-tag-input">标签</label>
              <div class="editor-chips" id="editor-chips">
                <input
                  id="editor-tag-input"
                  class="editor-tag-input"
                  type="text"
                  placeholder="输入后回车添加"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                />
              </div>
            </div>
            <div class="editor-foot">
              <span class="editor-hint"><kbd>⌘S</kbd> 保存 · <kbd>esc</kbd> 关闭</span>
              <button id="editor-retry" class="editor-retry hidden">重试</button>
            </div>
          </div>
        </div>

        <!-- 加密区管理（U9）。默认隐藏，⌘⇧V 唤出。 -->
        <div id="vault" class="editor hidden">
          <div class="editor-card vault-card">
            <div class="editor-head">
              <span class="editor-title">加密区管理</span>
              <button id="vault-close" class="banner-btn">关闭</button>
            </div>
            <div class="vault-sub" id="vault-sub"></div>
            <div class="vault-list" id="vault-list"></div>
            <div class="editor-foot">
              <span class="editor-hint">🔒 内容以 AES-256-GCM 加密 · <kbd>↩</kbd> 回贴 · <kbd>⌘E</kbd> 备注 · <kbd>esc</kbd> 关闭</span>
              <button id="vault-clear" class="editor-retry hidden">清除不可解密条目</button>
            </div>
          </div>
        </div>

        <!-- 设置（U12）。默认隐藏，⌘, 唤出，托盘菜单也可触发。 -->
        <div id="settings" class="editor hidden">
          <div class="editor-card settings-card">
            <div class="editor-head">
              <span class="editor-title">设置</span>
              <button id="settings-close" class="banner-btn">关闭</button>
            </div>
            <div class="editor-field">
              <label class="editor-label" for="settings-opacity">面板透明度</label>
              <div class="settings-row">
                <input id="settings-opacity" class="slider" type="range" min="30" max="100" step="2" />
                <span id="settings-opacity-value" class="settings-value">78%</span>
              </div>
            </div>
            <div class="editor-foot">
              <span class="editor-hint"><kbd>⌘,</kbd> 打开设置 · <kbd>esc</kbd> 关闭 · 改动即时生效,关闭时自动保存</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
