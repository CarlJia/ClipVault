<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipVault</title>
  </head>
  <body>
    <div id="app">
      <div class="panel">
        <div id="progress" class="progress"></div>
        <div id="banner" class="banner hidden"></div>
        <div id="vault-banner" class="banner banner-vault hidden"></div>
        <div id="guest-notice" class="banner banner-guest hidden"></div>
        <div class="search-row">
          <span class="search-icon">􀊫</span>
          <input
            id="search"
            type="text"
            placeholder="搜索剪贴板内容、备注、标签…"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </div>
        <div id="tabs" class="tabs"></div>
        <div id="list" class="list"></div>
        <div class="hint">↩ 粘贴 · ⌘1–9 直选 · 双击回贴 · ⌘E 备注 · ⌘P 置顶 · ⌘L 移入加密区 · ⌘⇧V 加密区 · ⌘⇧G 访客 · ⌘⇧N 本次不记录 · esc 关闭</div>
        <div id="toast" class="toast hidden"></div>

        <!-- 备注 / 标签编辑器（U6）。默认隐藏，⌘E 唤出。 -->
        <div id="editor" class="editor hidden">
          <div class="editor-card">
            <div class="editor-head">
              <span class="editor-title">备注 &amp; 标签</span>
              <span id="editor-state" class="editor-state"></span>
            </div>
            <div class="editor-preview" id="editor-preview"></div>
            <div class="editor-field">
              <label class="editor-label" for="editor-note">备注</label>
              <textarea
                id="editor-note"
                class="editor-note"
                maxlength="2000"
                rows="4"
                placeholder="添加备注…（进入搜索索引）"
                spellcheck="false"
              ></textarea>
              <div class="editor-counter" id="editor-counter">0 / 2000</div>
            </div>
            <div class="editor-field">
              <label class="editor-label" for="editor-tag-input">标签</label>
              <div class="editor-chips" id="editor-chips">
                <input
                  id="editor-tag-input"
                  class="editor-tag-input"
                  type="text"
                  placeholder="输入后回车添加"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                />
              </div>
            </div>
            <div class="editor-foot">
              <span class="editor-hint">⌘S 保存 · esc 关闭</span>
              <button id="editor-retry" class="editor-retry hidden">重试</button>
            </div>
          </div>
        </div>

        <!-- 加密区管理（U9）。默认隐藏，⌘⇧V 唤出。 -->
        <div id="vault" class="editor hidden">
          <div class="editor-card vault-card">
            <div class="editor-head">
              <span class="editor-title">加密区管理</span>
              <button id="vault-close" class="banner-btn">关闭</button>
            </div>
            <div class="vault-sub" id="vault-sub"></div>
            <div class="vault-list" id="vault-list"></div>
            <div class="editor-foot">
              <span class="editor-hint">🔒 内容以 AES-256-GCM 加密 · esc 关闭</span>
              <button id="vault-clear" class="editor-retry hidden">清除不可解密条目</button>
            </div>
          </div>
        </div>

        <!-- 设置（U12）。默认隐藏，⌘, 唤出，托盘菜单也可触发。 -->
        <div id="settings" class="editor hidden">
          <div class="editor-card settings-card">
            <div class="editor-head">
              <span class="editor-title">设置</span>
              <button id="settings-close" class="banner-btn">关闭</button>
            </div>
            <div class="editor-field">
              <label class="editor-label" for="settings-opacity">面板透明度</label>
              <div class="settings-row">
                <input id="settings-opacity" class="slider" type="range" min="30" max="100" step="2" />
                <span id="settings-opacity-value" class="settings-value">78%</span>
              </div>
            </div>
            <div class="editor-foot">
              <span class="editor-hint">⌘, 打开设置 · esc 关闭 · 改动即时生效,关闭时自动保存</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
