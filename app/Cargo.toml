[package]
name = "clipvault"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipvault-core = { path = "../clipvault-core" }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# U9：加密区条目的密文以 base64 存进 TEXT 列（content），nonce 存 BLOB 列。
base64 = "0.22"
# U9：move_to_vault 的每条随机 salt（salted content_hash，避免明文指纹）。
rand = "0.8"

# macOS 原生绑定（KTD2）。仅在 macOS 目标上编译。
# - NSPasteboard：U3 watcher 轮询 + U8 回贴写入。
# - NSWorkspace / NSRunningApplication：U8 前台应用捕获与失焦比对。
# - objc2-core-graphics：U8 CGEvent 模拟 ⌘V（CGEventCreateKeyboardEvent /
#   CGEventPost / CGEventSetFlags 对应 new_keyboard_event / post / set_flags）。
#   选用 objc2-core-graphics 而非 core-graphics crate，以与既有 objc2 0.6 家族
#   （objc2-foundation / objc2-app-kit 0.3）保持同一绑定栈、避免混用两套 FFI。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
    "NSWorkspace",
    "NSRunningApplication",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGEvent",
    "CGEventTypes",
    "CGEventSource",
    "CGRemoteOperation",
] }
# U9：Keychain 托管数据密钥（service = com.clipvault.data_key）。
security-framework = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
